name: ai-lab-embeddings

services:
  qwen-embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.7.2
    container_name: qwen-embeddings
    ports:
      - "8080:80"
    volumes:
      - hf_cache:/data
    environment:
      HF_TOKEN: ${HF_TOKEN}
    command:
      - --model-id
      - Qwen/Qwen3-Embedding-4B
      - --dtype
      - float16
    restart: unless-stopped

volumes:
  hf_cache:
