# ai-lab stack — one compose project for every containerised service.
#
# A bare `docker compose up -d` starts Open WebUI, Langfuse (included from the
# services/langfuse submodule), the ONNX embedding service, and the ASR stack
# (2 vLLM engines + api). Only two services stay profile-gated:
#   docker compose --profile unsloth        up -d    # Unsloth Studio
#   docker compose --profile agent-browser  up -d    # stealthy browser (Camoufox)
#
# GPU pinning (ASR): every ASR GPU consumer is pinned to the RTX 5080 via
# deploy.resources.reservations.devices.device_ids (host device index, see
# `nvidia-smi -L`; default 1). The 5090 (device 0) runs the other vLLM /
# llama.cpp workloads and must never be touched by this stack. Inside each
# container the pinned GPU is renumbered to cuda:0 — do NOT also set
# CUDA_VISIBLE_DEVICES, that would hide the reserved device.

networks:
  ai-lab-inference-net:
    name: ai-lab-inference-net # was external, created by setup.sh; now compose-managed, same name
  asr-net:
    name: ai-lab-asr_net # keeps ASR off the inference network, as before
    driver: bridge

# --- Langfuse ----------------------------------------------------------------
# The whole upstream stack (web, worker, postgres, clickhouse, redis, minio) is
# included verbatim from the submodule — update it with `git submodule update`,
# never edit the file in place. Upstream keeps its default ports; Open WebUI
# moved to 3100 to make room for Langfuse's :3000. The two service overrides
# below only add host-gateway so the LLM playground / evaluators can reach
# Unsloth Studio on the host at http://host.docker.internal:8888/v1.
include:
  - path: ./services/langfuse/docker-compose.yml

services:
  # Overrides for the included Langfuse stack (deep-merged over upstream):
  # 1. extra_hosts resolves host.docker.internal inside the containers so
  #    Langfuse can call Unsloth Studio on the host from the playground and
  #    LLM-as-a-judge.
  # 2. LANGFUSE_LLM_CONNECTION_WHITELISTED_HOST — Langfuse's SSRF guard
  #    hard-blocks "host.docker.internal" (and private IP ranges) for LLM
  #    connection base URLs; this allowlist is the self-hosted escape hatch
  #    (docs: self-hosting > configuration > hardening). Exact hostname match,
  #    checked before every other rule.
  langfuse-web:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      LANGFUSE_LLM_CONNECTION_WHITELISTED_HOST: host.docker.internal

  langfuse-worker:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      LANGFUSE_LLM_CONNECTION_WHITELISTED_HOST: host.docker.internal

  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    ports:
      - "3100:8080"
    environment:
      OPENAI_API_BASE_URL: http://host.docker.internal:8888/v1
      OPENAI_API_KEY: ${UNSLOTH_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ai-lab-inference-net
    volumes:
      - openwebui_data:/app/backend/data

  unsloth:
    # Unsloth is unreliable, disabled for now with a profile
    profiles: ["unsloth"]
    image: unsloth/unsloth
    networks:
      - ai-lab-inference-net
    ports:
      - "8000:8000"
      - "8888:8888"
    environment:
      NVIDIA_VISIBLE_DEVICES: "0"
      CUDA_DEVICE_ORDER: "PCI_BUS_ID"
      UNSLOTH_STUDIO_PASSWORD: "choose-a-password"
      JUPYTER_PASSWORD: "choose-a-password"
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - ./workspaces/unsloth:/workspace/host
      - ${HOME}/.cache/huggingface:/workspace/.cache/huggingface
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  embeddings_model:
    build: ./services/embeddings
    container_name: embedding_onnx
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - MODEL_ID=onnx-community/Qwen3-Embedding-4B-ONNX
      # Threadripper specific configuration
      - OMP_NUM_THREADS=24
      - MKL_NUM_THREADS=24
      - HF_HUB_DISABLE_SYMLINKS_WARNING=1
    ports:
      # Loopback-only; services on the compose network reach it at http://embedding:8080.
      - "127.0.0.1:8020:8080"
    volumes:
      # Maps your local machine cache into the container's standard HF location
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      start_period: 600s
      retries: 40
    networks:
      - ai-lab-inference-net
    restart: unless-stopped

  # --- stealthy-auto-browse (Camoufox, private browsing for agents) ---------
  # Camoufox (anti-detect Firefox fork) on a virtual display. JSON HTTP API +
  # MCP server on :8080 in-container, noVNC on :5900. Runs CPU-only (Mesa
  # software GL, no GPU passthrough); budget ~5GB RAM while browsing.
  # Host ports are loopback-only: agents on the compose network reach it at
  # http://stealthy-browser:8080. Set BROWSER_AUTH_TOKEN before first use.
  stealthy-browser:
    profiles: ["agent-browser"]
    image: psyb0t/stealthy-auto-browse:v2.6.7
    container_name: stealthy-browser
    shm_size: "2g"
    ports:
      - "127.0.0.1:8900:8080"
      - "127.0.0.1:5900:5900"
    environment:
      AUTH_TOKEN: ${BROWSER_AUTH_TOKEN:-}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python3 -c ''import urllib.request,sys; sys.exit(0 if urllib.request.urlopen("http://127.0.0.1:8080/health", timeout=5).status==200 else 1)''',
        ]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 10
    networks:
      - ai-lab-inference-net

  # --- ASR stack (Whisprflow replacement) ------------------------------------
  asr-model:
    build:
      context: ./services/asr/model-image
      args:
        VLLM_BASE: ${VLLM_IMAGE:-vllm/vllm-openai:latest}
    image: ai-lab-asr-vllm:latest
    container_name: asr-model
    restart: unless-stopped
    environment:
      HF_HOME: /root/.cache/huggingface
      HF_TOKEN: ${HF_TOKEN:-}
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
    volumes:
      # Share the host model cache — weights are pre-fetched with `hf download`.
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
    ipc: host
    ports:
      # Loopback-only debug port; asr-api reaches it over asr-net.
      - "127.0.0.1:${ASR_MODEL_DEBUG_PORT:-8010}:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${ASR_GPU_ID:-1}"]
              capabilities: [gpu]
    command:
      - ${ASR_MODEL_ID:-Qwen/Qwen3-ASR-1.7B}
      - --served-model-name
      - qwen3-asr
      - --gpu-memory-utilization
      - "${ASR_GPU_MEM_UTIL:-0.42}"
      - --max-model-len
      - "8192"
      - --max-num-seqs
      - "8"
    healthcheck:
      # First start may download ~5 GB of weights; give it room.
      test:
        [
          "CMD-SHELL",
          'python3 -c ''import urllib.request,sys; sys.exit(0 if urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=5).status==200 else 1)''',
        ]
      interval: 15s
      timeout: 10s
      start_period: 600s
      retries: 40
    networks:
      - asr-net

  cleanup-model:
    build:
      context: ./services/asr/model-image
      args:
        VLLM_BASE: ${VLLM_IMAGE:-vllm/vllm-openai:latest}
    image: ai-lab-asr-vllm:latest
    container_name: asr-cleanup-model
    restart: unless-stopped
    environment:
      HF_HOME: /root/.cache/huggingface
      HF_TOKEN: ${HF_TOKEN:-}
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
    ipc: host
    ports:
      - "127.0.0.1:${CLEANUP_MODEL_DEBUG_PORT:-8011}:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${ASR_GPU_ID:-1}"]
              capabilities: [gpu]
    command:
      - ${CLEANUP_MODEL_ID:-superwhisper/s1-mini}
      - --served-model-name
      - s1-mini
      # s1-mini was trained with Qwen3 thinking off; default it off for every
      # request (asr-api also sends chat_template_kwargs per request).
      - --default-chat-template-kwargs
      - '{"enable_thinking": false}'
      - --gpu-memory-utilization
      - "${CLEANUP_GPU_MEM_UTIL:-0.2}"
      - --max-model-len
      - "8192"
      - --max-num-seqs
      # Solo user, strictly serial dictation — no deep batch queue needed, and
      # fewer concurrent sequences cut the profiling peak memory.
      - "2"
    # Serial GPU bring-up: vLLM's memory profiling asserts free memory is
    # stable during init, so the second engine must not start while the
    # first one is still loading onto the same GPU.
    depends_on:
      asr-model:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python3 -c ''import urllib.request,sys; sys.exit(0 if urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=5).status==200 else 1)''',
        ]
      interval: 15s
      timeout: 10s
      start_period: 600s
      retries: 40
    networks:
      - asr-net

  asr-api:
    build: ./services/asr/api
    image: ai-lab-asr-api:latest
    container_name: asr-api
    restart: unless-stopped
    volumes:
      # The cleanup system prompt is the single source of truth shared with
      # promptfoo (evals/). Edit on the host, then `docker compose restart asr-api`.
      - ./services/asr/prompts:/prompts:ro
    ports:
      # Reachable from the MacBook client on the LAN. Set ASR_API_BIND=127.0.0.1
      # to keep it local-only.
      - "${ASR_API_BIND:-0.0.0.0}:${ASR_API_PORT:-8090}:8080"
    environment:
      LISTEN_ADDR: ":8080"
      ASR_BASE_URL: http://asr-model:8000/v1
      ASR_MODEL_NAME: qwen3-asr
      CLEANUP_BASE_URL: http://cleanup-model:8000/v1
      CLEANUP_MODEL_NAME: s1-mini
      CLEANUP_STYLING: ${CLEANUP_STYLING:-semi-formal}
      CLEANUP_PROMPT_FILE: /prompts/cleanup-system.txt
      ASR_API_TOKEN: ${ASR_API_TOKEN:-}
      MAX_AUDIO_BYTES: "26214400"
      UPSTREAM_TIMEOUT_SECONDS: "120"
    depends_on:
      asr-model:
        condition: service_healthy
      cleanup-model:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1",
        ]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 5
    networks:
      - asr-net

volumes:
  openwebui_data:
