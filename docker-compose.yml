# ai-lab stack.
#
# Base services (vLLM inference, mirroring
# models/qwen-3.8-27B-NVFP4/vllm_inference.sh) start with:
#   docker compose up -d
#
# The litellm services are behind the "litellm" profile and only start when
# explicitly requested:
#   docker compose --profile litellm up -d

networks:
  ai-lab-inference-net:
    external: true

services:
  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    ports:
      - "3000:8080"
    environment:
      OPENAI_API_BASE_URL: http://host.docker.internal:8888/v1
      OPENAI_API_KEY: ${UNSLOTH_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ai-lab-inference-net
    volumes:
      - openwebui_data:/app/backend/data

  # --- stealthy-auto-browse (Camoufox, private browsing for agents) ---------
  # Camoufox (anti-detect Firefox fork) on a virtual display. JSON HTTP API +
  # MCP server on :8080 in-container, noVNC on :5900. Runs CPU-only (Mesa
  # software GL, no GPU passthrough); budget ~5GB RAM while browsing.
  # Host ports are loopback-only: agents on the compose network reach it at
  # http://stealthy-browser:8080. Set BROWSER_AUTH_TOKEN before first use.
  stealthy-browser:
    profiles: ["agent-browser"]
    image: psyb0t/stealthy-auto-browse:v2.6.7
    container_name: stealthy-browser
    shm_size: "2g"
    ports:
      - "127.0.0.1:8900:8080"
      - "127.0.0.1:5900:5900"
    environment:
      AUTH_TOKEN: ${BROWSER_AUTH_TOKEN:-}
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request,sys; sys.exit(0 if urllib.request.urlopen(\"http://127.0.0.1:8080/health\", timeout=5).status==200 else 1)'"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 10
    networks:
      - ai-lab-inference-net

  vllm_inference:
    profiles: ["vllm"]
    image: vllm/vllm-openai:latest
    container_name: vllm-inference
    ports:
      - "8000:8000"
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command:
      - --model
      - unsloth/Qwen3.8-27B-NVFP4
      - --quantization
      - compressed-tensors
      - --kv-cache-dtype
      - fp8
      - --max-model-len
      - "131072"
      - --gpu-memory-utilization
      - "0.97"
      - --max-num-seqs
      - "4"
      - --speculative-config
      - '{"method":"mtp","num_speculative_tokens":2}'
      - --enable-prefix-caching
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_coder
      - --reasoning-parser
      - qwen3
    healthcheck:
      # vLLM can take several minutes to load the 27B model, so give it room
      # before the first check counts as a failure.
      test: ["CMD-SHELL", "python3 -c 'import urllib.request,sys; sys.exit(0 if urllib.request.urlopen(\"http://127.0.0.1:8000/health\", timeout=5).status==200 else 1)'"]
      interval: 15s
      timeout: 10s
      start_period: 300s
      retries: 60
    networks:
      - ai-lab-inference-net

  # --- litellm profile -------------------------------------------------------
  # LiteLLM quickstart stack (gateway + Postgres for models, virtual keys,
  # and spend logs). See https://docs.litellm.ai/docs/proxy/docker_quick_start
  #
  # LITELLM_MASTER_KEY and LITELLM_SALT_KEY are read from the environment
  # (e.g. a .env file). Set them to long random values before any real use,
  # and pin the image to a release tag instead of `latest`.

  litellm:
    profiles: ["litellm"]
    image: docker.litellm.ai/berriai/litellm-database:latest
    ports:
      - "4000:4000"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:-}
      DATABASE_URL: postgresql://litellm:litellm@litellm_db:5432/litellm
      STORE_MODEL_IN_DB: "True"
    depends_on:
      litellm_db:
        condition: service_healthy
    networks:
      - ai-lab-inference-net
    volumes:
      - ./litellm/litellm_config.yaml:/app/litellm_config.yaml
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["--config", "/app/litellm_config.yaml"]

  litellm_db:
    profiles: ["litellm"]
    image: postgres:16
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: litellm
      POSTGRES_DB: litellm
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ai-lab-inference-net
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  openwebui_data:
