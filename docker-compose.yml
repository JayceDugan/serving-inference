# ai-lab stack.
#
# Base service (Open WebUI, pointing at Unsloth Studio on the host gateway) starts with:
#   docker compose up -d
#
# The stealthy browser is behind the "agent-browser" profile and only starts when
# explicitly requested:
#   docker compose --profile agent-browser up -d

networks:
  ai-lab-inference-net:
    external: true

services:
  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    ports:
      - "3000:8080"
    environment:
      OPENAI_API_BASE_URL: http://host.docker.internal:8888/v1
      OPENAI_API_KEY: ${UNSLOTH_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ai-lab-inference-net
    volumes:
      - openwebui_data:/app/backend/data

  unsloth:
    image: unsloth/unsloth
    networks:
      - ai-lab-inference-net
    ports:
      - "8000:8000"
      - "8888:8888"
    environment:
      NVIDIA_VISIBLE_DEVICES: "0"
      CUDA_DEVICE_ORDER: "PCI_BUS_ID"
      UNSLOTH_STUDIO_PASSWORD: "choose-a-password"
      JUPYTER_PASSWORD: "choose-a-password"
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - ./unsloth-lab:/workspace/host
      - ${HOME}/.cache/huggingface:/workspace/.cache/huggingface
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  embeddings_model:
    profiles: ["embedding"]
    build: ./embeddings
    container_name: embedding_onnx
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - MODEL_ID=onnx-community/Qwen3-Embedding-4B-ONNX
      # Threadripper specific configuration
      - OMP_NUM_THREADS=24
      - MKL_NUM_THREADS=24
      - HF_HUB_DISABLE_SYMLINKS_WARNING=1
    ports:
      # Loopback-only; services on the compose network reach it at http://embedding:8080.
      - "127.0.0.1:8020:8080"
    volumes:
      # Maps your local machine cache into the container's standard HF location
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      start_period: 600s
      retries: 40
    networks:
      - ai-lab-inference-net
    restart: unless-stopped

  # --- stealthy-auto-browse (Camoufox, private browsing for agents) ---------
  # Camoufox (anti-detect Firefox fork) on a virtual display. JSON HTTP API +
  # MCP server on :8080 in-container, noVNC on :5900. Runs CPU-only (Mesa
  # software GL, no GPU passthrough); budget ~5GB RAM while browsing.
  # Host ports are loopback-only: agents on the compose network reach it at
  # http://stealthy-browser:8080. Set BROWSER_AUTH_TOKEN before first use.
  stealthy-browser:
    profiles: ["agent-browser"]
    image: psyb0t/stealthy-auto-browse:v2.6.7
    container_name: stealthy-browser
    shm_size: "2g"
    ports:
      - "127.0.0.1:8900:8080"
      - "127.0.0.1:5900:5900"
    environment:
      AUTH_TOKEN: ${BROWSER_AUTH_TOKEN:-}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python3 -c ''import urllib.request,sys; sys.exit(0 if urllib.request.urlopen("http://127.0.0.1:8080/health", timeout=5).status==200 else 1)''',
        ]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 10
    networks:
      - ai-lab-inference-net

volumes:
  openwebui_data:
